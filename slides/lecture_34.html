### Maximum likelihood for logistic regression

.large[
**Likelihood:** 
* For estimates `\(\widehat{\beta}_0\)` and `\(\widehat{\beta}_1\)`, `\(\widehat{\pi} = \dfrac{\exp\{\widehat{\beta}_0 + \widehat{\beta}_1 x\}}{1 + \exp\{\widehat{\beta}_0 + \widehat{\beta}_1 x\}}\)`
* `\(L(\widehat{\beta}_0, \widehat{\beta}_1) = P(\text{data})\)`
    
**Maximize:** 
* Choose `\(\widehat{\beta}_0\)`, `\(\widehat{\beta}_1\)` to maximize `\(L(\widehat{\beta}_0, \widehat{\beta}_1)\)`
    
.question[
In the class activity examples, we have only considered a few different possibilities for `\(\widehat{\beta}_0\)` and `\(\widehat{\beta}_1\)`. In reality, we consider all real numbers as possible values.
]
]

### Fitting logistic regression

.large[
.pull-left[
**Logistic regression with maximum likelihood**

* **Model:** `\(\log \left( \dfrac{\pi}{1 - \pi} \right) = \beta_0 + \beta_1 x\)`
* **Measure of fit:** `\(L(\widehat{\beta}_0, \widehat{\beta}_1) =\)` probability of observed data for estimates `\(\widehat{\beta}_0\)`, `\(\widehat{\beta}_1\)`
* **Optimize:** choose `\(\widehat{\beta}_0\)`, `\(\widehat{\beta}_1\)` to maximize `\(L(\widehat{\beta}_0, \widehat{\beta}_1)\)`
]

.pull-right[
**Linear regression with least squares**

&lt;br/&gt;

* **Model:** `\(y = \beta_0 + \beta_1 x + \varepsilon\)`
* **Measure of fit:** `\(SSE = \sum \limits_{i = 1}^n (y_i - \widehat{\beta}_0 - \widehat{\beta}_1 x_i)^2\)`
* **Optimize:** choose `\(\widehat{\beta}_0\)`, `\(\widehat{\beta}_1\)` to minimize SSE
]
]

### Regression assumptions

.large[
.question[
What assumptions did we make for linear regression models?
]
]

.large[
* Shape
* Constant variance
* Normality
* Independence
* Randomness

.question[
Not all these assumptions translate to logistic regression.
]

---

### Assumptions: logistic vs. linear regression

.large[
.pull-left[
**Logistic regression:**

`\(\pi = P(y = 1)\)` 

`\(\log \left( \dfrac{\pi}{1 - \pi} \right) = \beta_0 + \beta_1 x\)`

* shape
* randomness
* independence
]

.pull-right[
**Linear regression:**

`\(y = \beta_0 + \beta_1 x + \varepsilon\)`

`\(\varepsilon \sim N(0, \sigma_\varepsilon^2)\)`

* shape
* randomness
* independence
* constant variance
* normality

]

.question[
The constant variance and normality assumptions apply specifically to the noise term `\(\varepsilon\)`
]
]

### Assessing the shape assumption

.large[
.question[
How did we assess the shape assumption for linear regression?
]
]

.large[
With scatterplots and residual plots.

.question[
Can we use these diagnostics for logistic regression?
]
]

.large[
No: 
* the response is binary
* the shape assumption is that the *log odds* (not the response) are a linear function of the predictor(s)
]

### Shape

.large[
* Shape assumption is that the log-odds are (at least approximately) a linear function of `\(x\)`: `\(\log(odds) \approx \beta_0 + \beta_1 x\)`
* We can assess the shape assumption by plotting the **empirical log-odds** (aka empirical logits)
* Example: relationship between the length of a putt and whether it was made

| Length | 3 | 4 | 5 | 6 | 7 |
| --- | --- | --- | --- | --- | --- |
| Number of successes | 84 | 88 | 61 | 61 | 44 |
| Number of failures | 17 | 31 | 47 | 64 | 90 |
| Total | 101 | 119 | 108 | 125 | 134 |
]
