## Multiple regression

&lt;img src="lecture_21_files/figure-html/unnamed-chunk-4-1.png" style="display: block; margin: auto;" /&gt;


.large[
**Model:**

`\begin{align}
\text{bill length} &amp;= \beta_0 + \beta_1 \text{IsChinstrap} + \beta_2 \text{IsGentoo} \\
&amp; \hspace{0.5cm} + \beta_3 \text{body mass} + \varepsilon
\end{align}`
]

---

### Multiple regression model

.large[
`\begin{align}
\text{bill length} &amp;= \beta_0 + \beta_1 \text{IsChinstrap} + \beta_2 \text{IsGentoo} \\
&amp; \hspace{0.5cm} + \beta_3 \text{body mass} + \varepsilon
\end{align}`

**This gives us a separate regression line for each species of penguin.**

.question[
What is the regression line for Adelie penguins?
]
]

---

### Multiple regression model

.large[
`\begin{align}
\text{bill length} &amp;= \beta_0 + \beta_1 \text{IsChinstrap} + \beta_2 \text{IsGentoo} \\
&amp; \hspace{0.5cm} + \beta_3 \text{body mass} + \varepsilon
\end{align}`

**This gives us a separate regression line for each species of penguin.**

.question[
What is the regression line for Adelie penguins?
]
]

.large[
`\(\text{bill length} = \beta_0 + \beta_3 \text{body mass} + \varepsilon\)`

.question[
What about for Chinstrap and Gentoo penguins?
]
]

---

### Multiple regression model

.large[
`\begin{align}
\text{bill length} &amp;= \beta_0 + \beta_1 \text{IsChinstrap} + \beta_2 \text{IsGentoo} \\
&amp; \hspace{0.5cm} + \beta_3 \text{body mass} + \varepsilon
\end{align}`

**This gives us a separate regression line for each species of penguin:**

`$$\text{bill length} = \begin{cases} \beta_0 + \beta_3 \text{body mass} +  \varepsilon &amp; \text{species = Adelie} \\ \beta_0 + \beta_1 + \beta_3 \text{body mass} + \varepsilon &amp; \text{species = Chinstrap} \\ \beta_0 + \beta_2 + \beta_3 \text{body mass} +  \varepsilon &amp; \text{species = Gentoo} \end{cases}$$`

]

---

### Fitted model

.large[
`\begin{align}
\widehat{\text{bill length}} &amp;= 24.92 + 9.92 \ \text{IsChinstrap} + 3.56 \ \text{IsGentoo} \\
&amp; \hspace{0.5cm} + 0.0037 \ \text{body mass}
\end{align}`

.question[
How would I interpret `\(\widehat{\beta}_0 = 24.92\)`?
]
]

---

### Fitted model

.large[
`\begin{align}
\widehat{\text{bill length}} &amp;= 24.92 + 9.92 \ \text{IsChinstrap} + 3.56 \ \text{IsGentoo} \\
&amp; \hspace{0.5cm} + 0.0037 \ \text{body mass}
\end{align}`

.question[
How would I interpret `\(\widehat{\beta}_0 = 24.92\)`?
]
]

.large[
The estimated bill length for an Adelie penguin weighing 0g. (not that meaningful)

.question[
What about `\(\widehat{\beta}_1 = 9.92\)` and `\(\widehat{\beta}_2 = 3.56\)`?
]
]

---

### Interpreting regression coefficients

&lt;img src="lecture_21_files/figure-html/unnamed-chunk-5-1.png" style="display: block; margin: auto;" /&gt;


.large[

* `\(9.92 =\)` estimated mean difference in bill length for a Chinstrap and Adelie penguin with the same body mass
* `\(3.56 =\)` estimated mean difference in bill length for a Gentoo and Adelie penguin with the same body mass
]

---

### Interpreting regression coefficients

.large[
`\begin{align}
\widehat{\text{bill length}} &amp;= 24.92 + 9.92 \ \text{IsChinstrap} + 3.56 \ \text{IsGentoo} \\
&amp; \hspace{0.5cm} + 0.0037 \ \text{body mass}
\end{align}`

.question[
How would I interpret `\(\widehat{\beta}_3 = 0.0037\)`?
]
]

---

### Interpreting regression coefficients

.large[
`\begin{align}
\widehat{\text{bill length}} &amp;= 24.92 + 9.92 \ \text{IsChinstrap} + 3.56 \ \text{IsGentoo} \\
&amp; \hspace{0.5cm} + 0.0037 \ \text{body mass}
\end{align}`

.question[
How would I interpret `\(\widehat{\beta}_3 = 0.0037\)`?
]
]

.large[
The average change in bill length associated with an increase of 1g in body mass, holding species constant.

*Note that we assume the slope is the same for each species!*
]

### Predictions

.large[
`\begin{align}
\widehat{\text{bill length}} &amp;= 24.92 + 9.92 \ \text{IsChinstrap} + 3.56 \ \text{IsGentoo} \\
&amp; \hspace{0.5cm} + 0.0037 \ \text{body mass}
\end{align}`

.question[
What is the predicted bill length for a Gentoo penguin with a body mass of 5000 g?
]
]

---

### Predictions

.large[
`\begin{align}
\widehat{\text{bill length}} &amp;= 24.92 + 9.92 \ \text{IsChinstrap} + 3.56 \ \text{IsGentoo} \\
&amp; \hspace{0.5cm} + 0.0037 \ \text{body mass}
\end{align}`

.question[
What is the predicted bill length for a Gentoo penguin with a body mass of 5000 g?
]
]

.large[
`\(24.92 + 3.56 + 0.0037(5000) = 46.98\)`
]

---

### Fitting the model in R

.large[

``` r
m1 &lt;- lm(bill_length_mm ~ species + body_mass_g, 
                 data = penguins)
```

* `bill_length_mm ~ species + body_mass_g` is a `formula` in R
* Still `response ~ predictor(s)`
* `+` means "include more variables in the model"
]

---

``` r
m1 &lt;- lm(bill_length_mm ~ species + body_mass_g, 
                 data = penguins)
